# docker-compose para los servicios de soporte de Proyecto Shiro.
#
# Servicios:
#   - letta    Memoria persistente (ADRs 0017, 0018)
#   - whisper  STT con faster-whisper (ADR 0019)
#
# Se arrancan aparte del `npm run dev` porque son servicios de larga vida
# que quieres siempre arriba:
#
#   docker compose up -d           # ambos
#   docker compose up -d letta     # solo memoria
#   docker compose up -d whisper   # solo STT
#
# Requisitos previos:
#   1. Ollama corriendo en el host (localhost:11434) con los modelos:
#        ollama pull mxbai-embed-large   # para Letta
#   2. En `.env`:
#        LETTA_SERVER_PASSWORD=algo-secreto
#
# Verificar que arrancaron:
#   curl http://localhost:8283/v1/health/      # Letta
#   curl http://localhost:8765/health          # Whisper

services:
  letta:
    image: letta/letta:latest # TODO: pinar a una versión concreta cuando confirmemos una estable
    restart: unless-stopped
    ports:
      - '8283:8283'
    environment:
      # Protección por password (auth Bearer). El cliente usa la misma var.
      - SECURE=true
      - LETTA_SERVER_PASSWORD=${LETTA_SERVER_PASSWORD}
      # Embeddings + LLM del agente vía Ollama del host. El sufijo /v1 es
      # obligatorio (API compatible con OpenAI). En Windows/macOS el
      # contenedor llega al host por host.docker.internal, no localhost.
      - OLLAMA_BASE_URL=http://host.docker.internal:11434/v1
    extra_hosts:
      # Hace que host.docker.internal resuelva también en Linux (en Docker
      # Desktop Windows/macOS ya existe; añadirlo no molesta).
      - 'host.docker.internal:host-gateway'
    volumes:
      # Persiste la base de datos (Postgres interno de Letta) entre reinicios.
      - letta_pgdata:/var/lib/postgresql/data
    healthcheck:
      # La imagen de Letta es Python — usamos urllib en vez de curl (que
      # puede no estar instalado). /v1/health/ es liveness, no requiere auth.
      test:
        [
          'CMD',
          'python',
          '-c',
          "import urllib.request; urllib.request.urlopen('http://localhost:8283/v1/health/')",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

  whisper:
    # Build local: la imagen mete faster-whisper + FastAPI sobre una base
    # con CUDA runtime. Sin GPU el contenedor sigue funcionando (faster-
    # whisper detecta y cae a CPU automáticamente). Ver
    # services/whisper/README.md y ADR 0019.
    build:
      context: .
      dockerfile: services/whisper/Dockerfile
    image: shiro-whisper:local
    restart: unless-stopped
    ports:
      - '8765:8765'
    environment:
      - WHISPER_MODEL=${WHISPER_MODEL:-small}
      - WHISPER_DEVICE=${WHISPER_DEVICE:-auto}
      # int8_float16 combina pesos int8 con activaciones float16 — ~2x más
      # rápido en GPUs ajustadas (GTX 1650) con apenas pérdida de calidad.
      # Si arrancas sin CUDA, sobreescribe a `int8` en tu .env (faster-
      # whisper rechaza int8_float16 en CPU).
      - WHISPER_COMPUTE_TYPE=${WHISPER_COMPUTE_TYPE:-int8_float16}
      - WHISPER_LANGUAGE=${WHISPER_LANGUAGE:-es}
      # 2500 ms entre partials: con el diseño naive del V1 (retranscribir
      # el buffer entero cada vez) este intervalo controla cuánto cómputo
      # acumulado pagamos por turno. Bajar a 1500 ms hace los partials
      # más reactivos pero a costa de ~40 % más CPU/GPU.
      - WHISPER_PARTIAL_INTERVAL_MS=${WHISPER_PARTIAL_INTERVAL_MS:-2500}
      # Sesga el decoder hacia el nombre del personaje y reduce el error
      # de transcripción para nombres propios poco comunes. Cambialo si
      # tu personaje no se llama Shiro.
      - WHISPER_INITIAL_PROMPT=${WHISPER_INITIAL_PROMPT:-El usuario habla con un asistente llamado Shiro.}
    volumes:
      # Cache de modelos de Hugging Face — sobrevive a `docker compose down`.
      # `down -v` lo borra y la próxima vez re-descarga el modelo.
      - whisper_models:/root/.cache/huggingface
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://localhost:8765/health']
      interval: 30s
      timeout: 5s
      retries: 3
      # El modelo `small` tarda ~30 s en cargar la primera vez en CPU,
      # más si baja de internet. 120 s da margen amplio.
      start_period: 120s

volumes:
  letta_pgdata:
  whisper_models:
