name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

# Cancela ejecuciones previas del mismo PR si llega un push nuevo
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# El token del workflow solo lee el repo: ningún paso necesita escribir.
permissions:
  contents: read

jobs:
  # El check obligatorio de `develop` se ata al nombre de este job: si se
  # renombra, hay que cambiarlo también en la protección de la rama.
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # El mismo comando que se ejecuta en local antes de pushear. Compila
      # core primero para que TypeScript resuelva los tipos cross-package
      # (sin eso, ESLint type-aware ve `unknown` y dispara no-unsafe-*, ADR
      # 0011) y luego corre format:check, lint, typecheck, test, build y los
      # tests de los scripts de la raíz.
      - name: Verify (formato, lint, tipos, tests y build)
        run: npm run verify

      # Falla con un aviso high o critical en dependencias de producción, o
      # con una excepción caducada (scripts/audit-exceptions.json). Sin
      # `continue-on-error`: si el registro no responde, se relanza el job.
      - name: Audit de producción (high y critical)
        run: npm run audit:prod

  # Tests mínimos del servicio Whisper (topes, Origin y host por defecto).
  # No instala faster-whisper: los tests usan un transcriber falso. Las
  # versiones son las mismas que fija services/whisper/requirements.txt; si
  # cambian allí, cámbialas aquí. La suite completa de Python entra con P-18.
  whisper-limits:
    name: whisper-limits
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install fastapi==0.115.6 httpx==0.28.1 numpy==2.2.1 pytest==9.2.0

      - name: Tests de topes de Whisper
        run: python -m pytest services/whisper/tests/test_limits.py -q
