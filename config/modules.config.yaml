# Configuración de módulos activos
# Cambia el campo "active" para swappear implementaciones sin tocar código.
# Cada slot referencia una clase concreta en src/modules/<slot>/

version: 1

modules:
  # ─────────────────────────────────────────────────────────────
  # LLM — modelo de lenguaje
  # Local: Ollama + Qwen 2.5 (gratis, privado)
  # Cloud: Claude Sonnet (Anthropic, mejor calidad)
  # ─────────────────────────────────────────────────────────────
  llm:
    local:
      active: OllamaLLM
      config:
        # qwen2.5:3b cabe en GPUs de 4 GB. Subir a 7b con 8 GB+ VRAM,
        # 14b con 16 GB+ (RTX 5080, etc.). Ver README sección hardware.
        model: 'qwen2.5:3b'
        host: 'http://localhost:11434'
        temperature: 0.7
    cloud:
      active: AnthropicLLM
      config:
        model: 'claude-sonnet-4-6'
        # api_key se lee de ANTHROPIC_API_KEY en .env (NUNCA hardcodear)
        max_tokens: 1024

  # ─────────────────────────────────────────────────────────────
  # Router — decide qué LLM usa cada mensaje
  # Ver ADR 0015: clasificador LLM binario con fallback heurístico.
  # ─────────────────────────────────────────────────────────────
  router:
    active: HybridRouter
    config:
      classifier_model: 'qwen2.5:3b'
      # cloud_threshold se ignora en V1 (clasificación binaria local|cloud).
      # Reservado para V2 cuando llegue scoring real. Ver ADR 0015.
      cloud_threshold: 0.6

  # ─────────────────────────────────────────────────────────────
  # STT — voz → texto
  # ─────────────────────────────────────────────────────────────
  stt:
    active: WhisperSTT
    config:
      service_url: 'http://localhost:8765'
      language: 'es'
      vad_silence_ms: 800

  # ─────────────────────────────────────────────────────────────
  # TTS — texto → voz (con cadena de fallbacks)
  # Si el primero falla, el siguiente se activa. Ver ADR 0020:
  # Kokoro descartado; voz sintética/UTAU diferida a hito post-5080.
  # ─────────────────────────────────────────────────────────────
  tts:
    active: ElevenLabsTTS
    fallback_chain:
      - SystemTTS
    config:
      # Voice ID elegido por el usuario tras explorar Voice Design /
      # Voice Remix de ElevenLabs para una voz alineada con el personaje
      # kuudere de Shiro. Cambiarlo aquí basta — no requiere recompilar.
      voice_id: 'fgclHaSXgXdri8Z7CHiu'
      model_id: 'eleven_multilingual_v2'
      # `stability` por turno lo lee el TTS del bloque `emotions:` del
      # character YAML (default.yaml). Estos son los demás parámetros
      # que NO varían por emoción.
      similarity_boost: 0.78
      style: 0.15
      use_speaker_boost: true

  # ─────────────────────────────────────────────────────────────
  # Memory — memoria persistente
  # Modelo: Letta canónico + LocalMemory como WAL de continuidad.
  # Ver ADR 0017.
  # ─────────────────────────────────────────────────────────────
  memory:
    active: MemoryManager
    config:
      user_id: 'default'
      letta:
        base_url: 'http://localhost:8283'
        # agent_id vacío → el server auto-provisiona el agente al arrancar
        # (con embeddings Ollama) y persiste su id en el WAL local. Pega un
        # id aquí solo si quieres forzar un agente concreto. Ver ADR 0018.
        agent_id: ''
        # password: se lee de LETTA_SERVER_PASSWORD en .env (NUNCA hardcodear).
        # LLM del agente Letta. Obligatorio para crear el agente aunque la
        # generación la haga nuestro pipeline (no Letta). Reusa tu modelo.
        model: 'ollama/qwen2.5:3b'
        # Embeddings: config EXPLÍCITA a la API OpenAI-compat de Ollama
        # (OBLIGATORIOS para archival memory). Pullea el modelo primero:
        #   ollama pull mxbai-embed-large
        # El endpoint es desde la perspectiva del SERVER Letta: en Docker
        # llega al host por host.docker.internal y el sufijo /v1 es OBLIGATORIO.
        # Pasamos config explícita (no un handle de provider) porque el
        # provider nativo enruta mal el embedding. Ver ADR 0018.
        embedding_endpoint: 'http://host.docker.internal:11434/v1'
        embedding_model: 'mxbai-embed-large'
        embedding_dim: 1024
        context_window_limit: 16000
        # Timeout de las requests al server. 10s da margen al primer embedding
        # (el cold-start de Ollama puede tardar varios segundos); el WAL cubre
        # lo que aún así expire. La provisión del agente usa un timeout aparte.
        timeout_ms: 10000
      local:
        db_path: './data/memory.db'
      drainer:
        interval_ms: 5000
        batch_size: 100
      pipeline:
        # Cuántos turnos cronológicos recientes inyecta el pipeline en cada
        # llamada al LLM como contexto. getRecent no necesita embeddings, así
        # que es barato y fiable — subimos a 10 para mejor recall inmediato.
        recent_limit: 10
        # Cuántos turnos semánticamente relevantes pide a Letta por turno.
        # Si Letta no está disponible, se ignora silenciosamente.
        semantic_limit: 3
        # Timeout máximo (en ms) para las lecturas de memoria en el hot
        # path. Si Letta tarda más, el LLM responde sin contexto ese turno.
        timeout_ms: 1500

  # ─────────────────────────────────────────────────────────────
  # Avatar — render visual
  # Ver ADR 0021. El módulo Live2DAvatar es lógico server-side; el
  # render real corre en el cliente desktop con pixi-live2d-display.
  # Modelo + Cubism Core SDK se descargan manualmente (fuera del repo).
  # ─────────────────────────────────────────────────────────────
  avatar:
    active: Live2DAvatar
    config:
      # Path al `.model3.json` del modelo placeholder Hiyori. El cliente
      # lo sirve desde `packages/desktop/public/live2d/models/Hiyori/`,
      # que el dev rellena manualmente con los samples del Cubism SDK.
      # Si no existe, el `<Avatar>` cae al `<Orb>` (fallback automático).
      model_path: '/live2d/models/Hiyori/Hiyori.model3.json'
      # URL del `Live2DCubismCore.js` (propietario, descarga manual desde
      # https://www.live2d.com/sdk/download/web/). Se sirve desde
      # `packages/desktop/public/live2d/Core/`.
      cubism_core_url: '/live2d/Core/live2dcubismcore.js'
      # Cap de fps. 30 para hardware actual (GTX 1650 compartida con
      # Ollama/Whisper/Letta). Subir a 60 con RTX 5080.
      max_fps: 30
      # Animación idle automática del modelo (definida en model3.json).
      idle_animation: true
      # Expresión de descanso — el avatar la muestra al arrancar y
      # vuelve a ella tras tts:audio-ended. Se alinea con el YAML del
      # personaje; el alias de Hiyori la traduce a `default` en runtime.
      idle_expression: 'idle'

# ─────────────────────────────────────────────────────────────
# Personaje activo
# ─────────────────────────────────────────────────────────────
character:
  file: 'src/character/characters/default.yaml'
